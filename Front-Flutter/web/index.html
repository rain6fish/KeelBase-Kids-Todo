<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KeelBase - App Full-Stack Base Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KeelBase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KeelBase</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Loading placeholder — removed by Flutter engine after initialization.
    Must exist for the engine's DOM cleanup to work without errors.
  -->
  <div id="flutter-loader" style="display:flex;justify-content:center;align-items:center;height:100vh;">
    <div style="font-family:sans-serif;font-size:18px;color:#888;">Loading...</div>
  </div>
  <script>
    // Android WebView: 引擎残留的输入框若仍聚焦，每次触摸页面都会重新弹出输入法。
    // 点在输入框以外时先 blur 掉它；点在输入框本身（e.target 为它）时不处理。
    document.addEventListener('pointerdown', function (e) {
      var el = document.activeElement;
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') &&
          e.target !== el && !el.contains(e.target)) {
        el.blur();
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
